name: collections
storage: { path: collections, codec: yaml, shape: file, suffix: collection }
id: { generate: "{{ name | slug }}" }
schema:
  type: object
  required: [name, schema]
  properties:
    name:
      type: string
      description: The collection id — must equal the filename, and must be unique across every installed module.
    description:
      type: string
      description: What kind of thing this collection holds, in one line.
    use_when:
      type: string
      description: >-
        WHEN to reach for this collection, in one clause — rendered into the orientation block every
        agent session loads. OPTIONAL and usually absent: for most collections the trigger IS the
        description (`contacts` = a person; you use it when you have a person), and a restatement
        there costs every session tokens while diluting the few that carry real information. The
        test: author this only when an agent that FULLY UNDERSTANDS the description would still not
        know to reach for the collection. It spans both acts — read ("you are about to diagnose a
        defect — search here first") and write ("a day needs planning"). NOT a place for procedure:
        a `how` belongs in the module's skill, this field holds a `when`.
    title:
      type: string
      description: What to call this collection in the nav and page headers. DERIVED from `name` by title-casing when absent — author it only when that is wrong (`ui-views` → `UI Views`).
    title_template:
      type: string
      description: 'How to label a RECORD of this collection, e.g. `{{ name }}`. DERIVED from the first of title/name/subject the schema declares (else `{{ id }}`). Every reference field pointing at this collection renders its value through this, so it is authored HERE once, not on each referencing field.'
    extends:
      type: string
      description: 'The module collection this one overlays, as `<module>/<collection>`. An overlay adds or narrows fields; it never redefines storage.'
    storage:
      type: object
      description: Where the records live on disk and how they are encoded.
      properties:
        path:
          type: string
          description: >-
            Folder holding the records, workspace-relative. `data/<collection>` for content, which is
            the answer unless you can state a reason. `state/<collection>` also works and nothing
            uses it. ⚠ NEVER author `system/` — sources have lived in `modules/<module>/<kind>/`
            since the 2026-08-05 flatten, and a `system/` prefix is only how `runtime.js` still
            recognises a RUNTIME collection in a descriptor compiled by a pre-flatten engine.
        codec:
          type: string
          enum: [md, yaml, json, file]
          default: md
          description: 'File format. Use `md` whenever the record has a body a human will read. `file` makes the record an OPAQUE file — any extension, no frontmatter, fields DERIVED (`ext`, `bytes`), written with `add --from <path>` and never with `set`. For icons, logos and images.'
        max_bytes:
          type: integer
          default: 204800
          description: '`codec: file` only — the largest a record may be, in bytes. `check` reports anything over it. A record is a small file; a big one belongs outside the vault.'
        extensions:
          type: array
          items: { type: string }
          description: '`codec: file` only — the extensions this collection accepts, lowercase and without the dot. Omitted means any.'
        shape:
          type: string
          enum: [file, folder]
          default: file
          description: One file per record, or one folder per record.
        suffix:
          type: string
          description: 'The middle segment of a record filename: `<id>.<suffix>.<ext>`.'
        entry:
          type: string
          description: Folder shapes only — the file inside the folder that IS the record (e.g. SKILL.md).
        repo:
          type: string
          description: DERIVED by compile, never authored — the workspace-relative root of the git repo holding these records ('.' is the workspace). Set from the owning module's `owns-data`.
    id:
      type: object
      description: How a record's id is derived and what shape it is allowed to take.
      properties:
        generate:
          type: string
          description: 'Template the id is built from, e.g. `{{ created | date }}--{{ name | slug }}`. Derive it from a field the record OWNS, never from write time.'
        pattern:
          type: string
          description: Regex every id must match. `check` enforces it.
    schema:
      type: object
      description: A JSON Schema for the record's fields — validated against the meta-schema, not typed here. A field's own `description:` is what every surface shows as its explanation.
    order:
      type: number
      description: Sort position in the nav. Lower comes first.
    list_fields:
      type: array
      items: { type: string }
      description: The columns a list view shows by default.
    sort_field:
      type: string
      description: >-
        Which field carries MANUAL order — the one a drag writes. The field must be declared by this
        collection's own schema, and holds a fractional index (`dt <collection> move`), never an
        integer: renumbering is a multi-file commit against git. A surface offers dragging only while
        it is sorted by this field, because a handle that reorders nothing is a lie.
    icon:
      type: string
      description: material-symbols-outlined icon name, drawn in the nav and page header. The VS Code tree maps it to the nearest codicon — an unmapped name falls back to a generic cylinder, so pick one that is already mapped or add the row.
    owner:
      type: string
      x-reference: modules
      description: >-
        The module that OWNS this concept — DERIVED by compile from the base source, never authored.
        An overlay adds fields to somebody else's collection and does not take it over, so `meetings`
        stays owned by crm even though the workspace module overlays it. This is the workspace's real partition, and
        what the nav groups by.
    group:
      type: string
      description: >-
        DEPRECATED as a nav axis since 2026-08-11 — the nav groups by `owner` (a module, which has a
        title of its own) instead of by this string with a display-name map maintained in a surface.
        Still read by nothing; kept so the change is a code revert rather than a data migration, and
        because a workspace may yet want a partition that deliberately DIFFERS from its modules.
order: 10
list_fields: [name, last-modified]
icon: schema
group: system
