name: collections
storage: { path: collections, codec: yaml, shape: file, suffix: collection }
id: { generate: "{{ name | slug }}" }
schema:
  type: object
  required: [name, schema]
  properties:
    name:
      type: string
      description: The collection id — must equal the filename, and must be unique across every installed module.
    description:
      type: string
      description: >-
        What one record IS, in one line — and the neighbour it is NOT, when a confusable one exists
        ("the person, never the org — that is `companies`"). Rendered into the orientation block
        every agent session loads, so it is retrieval surface, not documentation.
    use_when:
      type: string
      description: >-
        The SITUATIONS that should bring a session here, in one clause — rendered under the
        description in the orientation block. A description says what a record is; this says when
        to reach for the collection, in both directions: to READ ("about to diagnose a defect — search
        here first, filtered by repo") and to WRITE ("a thought arrives that has no home yet"). Author
        it for every collection whose trigger is not literally "you have one of these": a schema is
        designed to be used, and the measured failure is a session inventing a new state or field while
        the collection that already modelled it sat in its context. Two rules: it names a situation,
        never a procedure (a `how` belongs in the module's skill); and it must not restate the
        description — a paraphrase costs every session tokens and dilutes the clauses that carry
        signal. Omit only where the noun is the whole trigger.
    title:
      type: string
      description: What to call this collection in the nav and page headers. DERIVED from `name` by title-casing when absent — author it only when that is wrong (`ui-views` → `UI Views`).
    title_template:
      type: string
      description: 'How to label a RECORD of this collection, e.g. `{{ name }}`. DERIVED from the first of title/name/subject the schema declares (else `{{ id }}`). Every reference field pointing at this collection renders its value through this, so it is authored HERE once, not on each referencing field.'
    extends:
      type: string
      description: 'The module collection this one overlays, as `<module>/<collection>`. An overlay adds or narrows fields; it never redefines storage.'
    storage:
      type: object
      description: Where the records live on disk and how they are encoded.
      properties:
        path:
          type: string
          description: >-
            Folder holding the records, workspace-relative. `data/<collection>` — that is the answer
            unless you can state a reason. `state/<collection>` is DEPRECATED as a convention since
            2026-08-31: decision 4 created it for runs, triggers, registries and cursors, all seven
            of those collections have been deleted, and the one real operational-data need that
            arrived since went to a gitignored `.cache/*.jsonl` because append-only readings are the
            wrong shape for records. The mechanism still works and is kept, exactly like `group`
            below, so a workspace wanting a second root has one. ⚠ NEVER author `system/` — sources
            have lived in `modules/<module>/<kind>/` since the 2026-08-05 flatten, and a `system/`
            prefix is only how `runtime.js` recognises a RUNTIME collection in a descriptor compiled
            by a pre-flatten engine.
        codec:
          type: string
          enum: [md, yaml, json, file]
          default: md
          description: 'File format. Use `md` whenever the record has a body a human will read. `file` makes the record an OPAQUE file — any extension, no frontmatter, fields DERIVED (`ext`, `bytes`), written with `add --from <path>` and never with `set`. For icons, logos and images.'
        max_bytes:
          type: integer
          default: 204800
          description: '`codec: file` only — the largest a record may be, in bytes. `check` reports anything over it. A record is a small file; a big one belongs outside the vault.'
        extensions:
          type: array
          items: { type: string }
          description: '`codec: file` only — the extensions this collection accepts, lowercase and without the dot. Omitted means any.'
        shape:
          type: string
          enum: [file, folder]
          default: file
          description: One file per record, or one folder per record.
        suffix:
          type: string
          description: 'The middle segment of a record filename: `<id>.<suffix>.<ext>`.'
        entry:
          type: string
          description: Folder shapes only — the file inside the folder that IS the record (e.g. SKILL.md).
        repo:
          type: string
          description: DERIVED by compile, never authored — the workspace-relative root of the git repo holding these records ('.' is the workspace). Set from the owning module's `owns-data`.
    id:
      type: object
      description: How a record's id is derived and what shape it is allowed to take.
      properties:
        generate:
          type: string
          description: 'Template the id is built from, e.g. `{{ created | date }}--{{ name | slug }}`. Derive it from a field the record OWNS, never from write time.'
        pattern:
          type: string
          description: Regex every id must match. `check` enforces it.
    schema:
      type: object
      description: A JSON Schema for the record's fields — validated against the meta-schema, not typed here. A field's own `description:` is what every surface shows as its explanation.
    order:
      type: number
      description: Sort position in the nav. Lower comes first.
    list_fields:
      type: array
      items: { type: string }
      description: The columns a list view shows by default.
    sort_field:
      type: string
      description: >-
        Which field carries MANUAL order — the one a drag writes. The field must be declared by this
        collection's own schema, and holds a fractional index (`dt move <collection>/<id>`), never an
        integer: renumbering is a multi-file commit against git. A surface offers dragging only while
        it is sorted by this field, because a handle that reorders nothing is a lie.
    icon:
      type: string
      description: material-symbols-outlined icon name, drawn in the nav and page header. The VS Code tree maps it to the nearest codicon — an unmapped name falls back to a generic cylinder, so pick one that is already mapped or add the row.
    unresolved_peers:
      type: array
      items: { type: string }
      description: >-
        DERIVED by compile, never authored — the collections THIS one references that its module
        declared as a `peerDependencies` peer and nothing installed provides. `check` reads it to
        excuse those references as unresolvable rather than wrong, which is what lets a module be
        opened on its own. It is stated here as DATA precisely so the record layer never has to
        learn what a module is; a bare string list rather than `x-reference: collections`, because
        the whole point is that the target is absent.
    module:
      type: string
      description: >-
        The module that OWNS this concept, as its bare id — DERIVED by compile from the base source,
        and the one field a `dt set` may write: `dt set collections/<c> module=<m>` MOVES the
        descriptor into that module. An overlay adds fields to somebody else's collection and does
        not take it over, so the owner is the source declaring no `extends`. This is the workspace's
        real partition, and what the nav groups by.
    overlays:
      type: array
      items: { type: string }
      description: >-
        DERIVED by compile, never authored — the modules contributing an `extends:` overlay to this
        collection, by id. ABSENT when there are none: an empty list is a statement nobody made.
        `dt get collections/<c> --module <m>` prints one contribution alone.
    owner:
      type: string
      x-reference: modules
      description: >-
        ⚠ COMPAT, ONE RELEASE ONLY — superseded by `module`, which carries the same fact as the bare
        id the operator actually types. Kept because a surface groups its nav by this key and reads
        it as a reference; both are written by compile until that surface has moved. Removed in the
        release after 0.19.0.
    group:
      type: string
      description: >-
        DEPRECATED as a nav axis since 2026-08-11 — the nav groups by `owner` (a module, which has a
        title of its own) instead of by this string with a display-name map maintained in a surface.
        Still read by nothing; kept so the change is a code revert rather than a data migration, and
        because a workspace may yet want a partition that deliberately DIFFERS from its modules.
order: 10
list_fields: [name, last-modified]
icon: schema
group: system
