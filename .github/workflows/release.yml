name: release

# Tag-only, on purpose. A merge to main can NEVER publish — releasing requires
# deliberately pushing a v* tag, which is the permission gate expressed in CI.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      # A tag that disagrees with package.json publishes the wrong version under the right
      # name, and npm's unconditional unpublish window is only 72 hours.
      - name: tag must match package.json version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          echo "tag=$TAG package.json=$PKG"
          [ "$TAG" = "$PKG" ] || { echo "::error::tag $TAG does not match package.json $PKG"; exit 1; }

      - name: layer direction
        run: npm run layers

      - name: size budgets
        run: npm run metrics:check

      # A release must not be able to ship what CI would have rejected.
      - name: tests
        run: npm test

      - name: first-run smoke
        run: |
          set -euo pipefail
          PKG=$(npm pack --silent | tail -1)
          PKG_PATH="$PWD/$PKG"
          D=$(mktemp -d)
          cd "$D"
          git init -q
          git config user.email ci@example.com
          git config user.name CI
          npm init -y >/dev/null
          npm install --silent "$PKG_PATH"
          npx dreamteamer init
          npx dreamteamer compile
          npx dreamteamer check

      - name: publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
