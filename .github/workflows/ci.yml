name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    name: node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: layer direction
        run: npm run layers

      - name: size budgets
        run: npm run metrics:check

      - name: tests
        run: npm test

      - name: cli loads
        run: node bin/dreamteamer.js --version

      # The first sixty seconds of a new user's life, against the packed tarball (the script says why).
      - name: first-run smoke
        run: bash scripts/first-run-smoke.sh

  # The suite runs on Linux only; Windows gets the first-run smoke, which drives compile, check, add,
  # list and get through the paths that broke there (runtime keys and record ids spelled with `\`).
  windows:
    runs-on: windows-latest
    name: windows · first-run
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: cli loads
        run: node bin/dreamteamer.js --version

      - name: first-run smoke
        shell: bash
        run: bash scripts/first-run-smoke.sh

      # Discovery only: what else the suite says about Windows. Not a gate.
      - name: suite (informational)
        continue-on-error: true
        timeout-minutes: 12
        run: npm test
