name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # a checkout runs src/*.ts through Node's own type stripping, which needs 22.18+; the
        # PUBLISHED package is the build in dist/ and still runs on 20 — the node20 job proves that
        node: [22, 24]
    name: node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: layer direction
        run: npm run layers

      - name: size budgets
        run: npm run metrics:check

      - name: types
        run: npm run typecheck

      - name: tests
        run: npm test

      - name: cli loads
        run: node bin/dreamteamer.js --version

      # The first sixty seconds of a new user's life, against the packed tarball (the script says why).
      - name: first-run smoke
        run: bash scripts/first-run-smoke.sh

  # The npm package is dist/ (built by prepack), and engines still says >=20. The source cannot run
  # there (no type stripping), so node 20 is proven the way a stranger meets it: the packed tarball.
  node20:
    runs-on: ubuntu-latest
    name: node 20 · packed
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: first-run smoke
        run: bash scripts/first-run-smoke.sh

  # The suite runs on Linux only; Windows gets the first-run smoke, which drives compile, check, add,
  # list and get through the paths that broke there (runtime keys and record ids spelled with `\`).
  windows:
    runs-on: windows-latest
    name: windows · first-run
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: cli loads
        run: node bin/dreamteamer.js --version

      - name: first-run smoke
        shell: bash
        run: bash scripts/first-run-smoke.sh

      # Discovery only: what else the suite says about Windows. Not a gate.
      - name: suite (informational)
        continue-on-error: true
        timeout-minutes: 12
        run: npm test
