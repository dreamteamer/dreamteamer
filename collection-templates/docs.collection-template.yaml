name: docs
description: >-
  title / content / tags, under a dated slug id (`2026-07-23--<title>`) — the shape of a thing that
  HAPPENED or was written on a day: a note, a report, a meeting write-up. For a thing that IS, use `entity`.
template:
  storage: { codec: md, shape: file }
  id:
    generate: "{{ created | date }}--{{ title | slug }}"
    pattern: "^\\d{4}-\\d{2}-\\d{2}--[a-z0-9-]+$"
  schema:
    type: object
    required: [title]
    properties:
      title:   { type: string }
      content: { type: string, format: markdown, x-body: true }
      tags:    { type: array, items: { type: string } }
  list_fields: [title, tags]
