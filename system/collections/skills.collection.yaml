name: skills
storage: { path: system/skills, codec: md, shape: folder, entry: SKILL.md }
id: { generate: "{{ name | slug }}" }
schema:
  type: object
  required: [name, description]
  properties:
    name:         { type: string }
    description:  { type: string }
    instructions: { type: string, format: markdown, x-body: true }
order: 20
list_fields: [name, last-modified, description]
icon: psychology
group: system
