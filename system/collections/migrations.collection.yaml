name: migrations
storage: { path: system/migrations, codec: yaml, shape: file, suffix: migration }
id: { pattern: "^\\d+--[a-z0-9-]+$" }
schema:
  type: object
  required: [collection, operations]
  properties:
    collection:  { type: string, x-reference: collections }
    description: { type: string }
    operations:
      type: array
      items:
        type: object
        properties:
          op:    { type: string, enum: [rename-field, fill-default, remove-field] }
          from:  { type: string }
          to:    { type: string }
          field: { type: string }
          value: {}
order: 100
list_fields: [collection, last-modified, description]
icon: move_up
group: system
