name: teams
storage: { path: data/teams, codec: yaml, shape: file, suffix: team }
id: { generate: "{{ name | slug }}" }
schema:
  type: object
  required: [name]
  properties:
    name:        { type: string }
    description: { type: string }
    members:     { type: array, items: { type: string, x-reference: users, x-display: "{{ name }}" } }
order: 150
list_fields: [name, last-modified, members]
icon: group
group: system
