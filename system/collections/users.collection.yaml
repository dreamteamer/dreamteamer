name: users
storage: { path: data/users, codec: yaml, shape: file, suffix: user }
id: { generate: "{{ name | slug }}" }
schema:
  type: object
  required: [name]
  properties:
    name:        { type: string }
    description: { type: string }
    email:       { type: string, format: email }
order: 140
list_fields: [name, last-modified, email]
icon: badge
group: system
